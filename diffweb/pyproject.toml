# diffweb as a standalone tool, so people who do not use these dotfiles can
# install it. The dotfiles' own `uv sync` does not use this file.
#
#   uv tool install "git+https://github.com/tupoiu/dotfiles#subdirectory=diffweb"
#
# The build needs `bun` on PATH (it bundles web/*.ts) and the network (it
# vendors diff2html and highlight.js) - see hatch_build.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffweb"
version = "0.1.0"
description = "A local web UI for reviewing your own work across git worktrees"
readme = "README.md"
requires-python = ">=3.11"
# Keep in step with the `diffweb` group in the dotfiles' pyproject.toml.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.scripts]
diffweb = "diffweb.__main__:main"

[tool.hatch.build.targets.wheel]
# This directory is the package itself, so put every file under diffweb/.
sources = {"" = "diffweb"}
# Only what runs: the page sources, dev tooling and planning notes stay out.
include = ["/*.py", "/hud", "/templates", "/static", "/README.md"]
exclude = ["/hatch_build.py", "**/__pycache__"]
# Built by hatch_build.py, and gitignored.
artifacts = ["static/dist/**", "static/vendor/*"]

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "**/__pycache__"]
artifacts = ["static/dist/**", "static/vendor/*"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
